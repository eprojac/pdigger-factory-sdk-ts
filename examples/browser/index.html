<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pDigger Factory SDK: viz example</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "pdigger-factory-sdk": "/dist/index.js",
          "pdigger-factory-sdk/viz": "/dist/viz/index.js"
        }
      }
    </script>
    <style>
      :root {
        --bg: #0f1317;
        --panel: #171c22;
        --line: #2a323b;
        --text: #dfe5ea;
        --muted: #8b97a3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      header {
        display: flex;
        gap: 24px;
        align-items: baseline;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      #status {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 360px;
        gap: 12px;
        padding: 12px 16px;
      }
      figure {
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      figcaption {
        padding: 6px 10px;
        color: var(--muted);
        font-size: 12px;
        border-bottom: 1px solid var(--line);
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
      }
      #feed {
        list-style: none;
        margin: 0;
        padding: 6px 10px;
        height: calc((100vw - 32px - 24px - 360px) / 2 * 9 / 16);
        min-height: 240px;
        overflow: auto;
        font:
          12px/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
      }
      [hidden] {
        display: none !important;
      }
      /* the report mode (?report=<tray>): TrayReportView with HTML labels, a legend and the report's text */
      #report-mode {
        grid-template-columns: minmax(0, 1fr) 560px;
        align-items: start;
      }
      .report-titles {
        position: relative;
        height: 30px;
      }
      .report-titles span {
        position: absolute;
        bottom: 6px;
        transform: translateX(-50%);
        white-space: nowrap;
        font-weight: 600;
      }
      .report-stage {
        position: relative;
      }
      #report-scene {
        aspect-ratio: 2.3;
      }
      #report-labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #report-labels span {
        position: absolute;
        transform: translate(-50%, -50%);
        white-space: pre;
        text-align: center;
        padding: 1px 6px;
        border-radius: 4px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.75);
        color: #fff;
        font:
          600 12px/1.35 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      #report-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        list-style: none;
        margin: 0;
        padding: 8px 10px 10px;
        color: var(--muted);
        font-size: 12px;
      }
      #report-legend i {
        display: inline-block;
        width: 16px;
        height: 11px;
        margin-right: 6px;
        border-radius: 2px;
        vertical-align: -1px;
      }
      #report-text {
        margin: 0;
        padding: 8px 10px;
        font:
          12px/1.55 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        white-space: pre-wrap;
      }
      @media (max-width: 1100px) {
        main {
          grid-template-columns: 1fr;
        }
        #feed {
          height: 320px;
        }
        #report-mode {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>pDigger Factory SDK &middot; viz</h1>
      <span id="status">loading&hellip;</span>
    </header>
    <main id="views">
      <figure>
        <figcaption>OverlayCanvas &middot; video space (the overlay layer)</figcaption>
        <canvas id="overlay" width="960" height="540"></canvas>
      </figure>
      <figure>
        <figcaption>SceneView &middot; three.js (the scene and world layers)</figcaption>
        <canvas id="scene" width="960" height="540"></canvas>
      </figure>
      <figure>
        <figcaption>EventFeed &middot; events and activities, newest first</figcaption>
        <ul id="feed"></ul>
      </figure>
    </main>
    <main id="report-mode" hidden>
      <figure>
        <figcaption>
          TrayReportView &middot; the tray as it arrived and as it left, from above, coloured by its report
        </figcaption>
        <div id="report-titles" class="report-titles"></div>
        <div class="report-stage">
          <canvas id="report-scene" width="960" height="420"></canvas>
          <div id="report-labels"></div>
        </div>
        <ul id="report-legend"></ul>
      </figure>
      <figure>
        <figcaption>TrayReport &middot; describe()</figcaption>
        <pre id="report-text"></pre>
      </figure>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
