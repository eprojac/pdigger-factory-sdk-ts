version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    # The dev tools' majors wait for a change of their own: each needs config or code edits, and Vitest's coverage
    # counts differently. TypeScript 7 also needs typedoc and typescript-eslint to accept it. @types/node follows the
    # oldest Node the gate runs (22).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: happy-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Dockerfile.test gates on two bases, the newest Node LTS and 22, and the try-it Dockerfile uses the newest: a new
    # LTS major is chosen by hand (odd majors never become LTS), so Dependabot only keeps the pinned tags' digests
    # current.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
