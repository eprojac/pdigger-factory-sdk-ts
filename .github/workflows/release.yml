name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  publish:
    name: Build the release package
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ vars.SDK_GITHUB_ONLY_TAG == github.ref_name && 'github-release' || 'npm' }}
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The tag is the package version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - run: npm run build
      - run: npm pack
      - name: Save the tarball for a GitHub-only release
        if: vars.SDK_GITHUB_ONLY_TAG == github.ref_name
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: pdigger-factory-sdk-*.tgz
          if-no-files-found: error
      - name: npm publish
        if: vars.SDK_GITHUB_ONLY_TAG != github.ref_name
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release with the package
        if: vars.SDK_GITHUB_ONLY_TAG != github.ref_name
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pdigger-factory-sdk-*.tgz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
