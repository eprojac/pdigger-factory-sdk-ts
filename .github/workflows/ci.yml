name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck
      - name: eslint
        run: npm run lint
      - name: prettier --check
        run: npm run format:check

  docker:
    name: Unit tests in Docker (no network, 100 % coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  node:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  node18:
    name: The built package on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Golden replays and the fake on Node 18
        run: node scripts/smoke.mjs

  deno:
    name: The built package on Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Golden replays and the fake on Deno (the package by its name, no network)
        run: deno run --allow-read --allow-env scripts/smoke.mjs

  bun:
    name: The built package on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - name: Golden replays and the fake on Bun
        run: bun scripts/smoke.mjs

  image:
    name: The try-it image (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make image-check (the quickstart against the fake, the viz page's files with three.js; no network)
        run: make image-check

  docs:
    name: API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeDoc
        run: npm run docs
      - uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: docs/api
          retention-days: 14

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The declarations in consumer projects (ES2022 and DOM without Node types; Node; ESNext with three.js)
        run: npm run typecheck:consumer
      - name: npm pack --dry-run
        run: npm pack --dry-run
