  /api/v2/session/world/events:
    get:
      operationId: getWorldEvents
      tags:
      - Interpreter
      summary: The event log of this session (lift, carry, place, push, new, delete, split, ...).
      description: 'A frame''s events are those of its newest world revision; a revised frame''s events replace its earlier
        ones and are never listed twice. So a reader that follows `next_after` past a frame that is revised later (a paused
        frame and the few after it, fixer thin-v1) does not see the events the revision adds: after a revision of frame g
        (the world long-poll, or `stable.hold`), read again from `after` = g - 1, or take the events from the world layer
        itself.


        **SDK** · Go `c.API().GetWorldEvents(ctx, …)` · Python `await factory.api.get_world_events(…)` · Rust `factory.api().get_world_events(…).await`
        · TypeScript `await factory.api.getWorldEvents(…)`


        **High level** · Python `async for ev in factory.interpreter().events()` · TypeScript `for await (const ev of factory.interpreter().events())`'
      parameters:
      - name: after
        in: query
        description: Only events with a larger `g`.
        schema:
          type: integer
          minimum: -1
          default: -1
        examples:
          ok_after:
            value: 6380
            summary: Since g 6380
          bad_after:
            value: abc
            summary: Not an integer
      - name: limit
        in: query
        description: 'At most this many events, by whole frames: the events of one frame are never split, so a frame that
          alone has more comes whole, and a next request with `after` = `next_after` loses nothing while those frames are
          retained (see `oldest_g`).'
        schema:
          type: integer
          minimum: 1
          maximum: 1024
          default: 256
        examples:
          ok_limit:
            value: 100
            summary: At most 100
          bad_limit:
            value: 0
            summary: Below 1
      - name: type
        in: query
        description: Comma-separated event types.
        schema:
          type: string
        examples:
          ok_lifts:
            value: lift,place
            summary: Only lifts and put-downs
          ok_splits:
            value: split,new
            summary: Splits and new stones
          bad_type:
            value: nonsense
            summary: Not an event type
      responses:
        '200':
          description: Events, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLog'
              examples:
                ok_lifts:
                  summary: Lifts and put-downs
                  value:
                    session: 1794353523
                    video: aug28
                    events:
                    - g: 6389
                      t: 1277.8
                      type: lift
                      id: 72
                      side: right
                    - g: 6409
                      t: 1281.8
                      type: place
                      id: 72
                      side: right
                      why: slot-t-release
                    next_after: 6409
                    oldest_g: 6386
                ok_one_frame:
                  summary: One whole frame, though it has more events than limit
                  description: 'With `limit=1` every reply is one frame''s events, however many there are: here the first
                    frame of the world at the carry, where its stones are new. Follow `next_after` to read the log frame by
                    frame.'
                  value:
                    session: 1794353523
                    video: aug28
                    events:
                    - g: 6386
                      t: 1277.2
                      type: new
                      id: 1
                    - g: 6386
                      t: 1277.2
                      type: new
                      id: 2
                    - g: 6386
                      t: 1277.2
                      type: new
                      id: 3
                    next_after: 6386
                    oldest_g: 6386
                ok_fills:
                  summary: Stones the model never boxed, and splits
                  description: 'Fixer thin-v1, paused on dry2 at 9:49: rest refinement of the paused frame added two stones
                    the model never boxed, each a `new` with `source: image`. A split (none here) keeps the old id on the
                    larger part and names the new part in `into`. A revision replaces its frame''s events in this log, which
                    lists them once: a reader that had passed the frame reads it again from `after` = g - 1 (or takes the
                    events from the world long-poll).'
                  value:
                    session: 1794446896
                    video: dry2
                    events:
                    - g: 2953
                      t: 588.956667
                      type: new
                      id: 41
                      source: image
                    - g: 2953
                      t: 588.956667
                      type: new
                      id: 42
                      source: image
                    next_after: 2956
                    oldest_g: 2950
        '400':
          description: Bad parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_after:
                  summary: after is an integer
                  value:
                    error: after must be an integer
                    code: invalid_param
                    field: after
                bad_type:
                  summary: Not an event type
                  value:
                    error: unknown event type 'nonsense'
                    code: invalid_param
                    field: type
                bad_type_plural:
                  summary: Event types are singular
                  value:
                    error: unknown event type 'splits'
                    code: invalid_param
                    field: type
                bad_limit:
                  summary: limit is 1..1024
                  value:
                    error: limit must be within 1..1024
                    code: invalid_param
                    field: limit
      x-level: high
      x-sdk:
        go: c.API().GetWorldEvents(ctx, …)
        python: await factory.api.get_world_events(…)
        rust: factory.api().get_world_events(…).await
        typescript: await factory.api.getWorldEvents(…)
        high:
          go: for ev, err := range c.Interpreter().Events(ctx)
          python: async for ev in factory.interpreter().events()
          rust: factory.interpreter().events().await?
          typescript: for await (const ev of factory.interpreter().events())
  /api/v2/session/world/stones/{id}:
    get:
      operationId: getStone
      tags:
      - Interpreter
      summary: One stone, with its path since the session began.
      parameters:
      - name: id
        in: path
        required: true
        description: The world's stone id.
        schema:
          type: integer
          minimum: 0
        examples:
          ok_carried:
            value: 72
            summary: The carried stone
          bad_float:
            value: '7.5'
            summary: Not an integer
          bad_unknown:
            value: 999999
            summary: Not in the world
      responses:
        '200':
          description: The track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoneTrack'
              examples:
                ok_carried:
                  summary: Where stone 72 has been
                  value:
                    schema: sts1
                    session: 1794353523
                    video: aug28
                    id: 72
                    g: 6389
                    t: 1277.8
                    stone:
                      id: 72
                      mode: carry
                      family: dogbone
                      shape: model
                      detected: false
                      uncertain: false
                      side: right
                      outline:
                      - - 372.05
                        - 474.42
                      solid:
                        pos:
                        - -1.2055
                        - -0.2421
                        - 0.2159
                        q:
                        - -0.40383
                        - 0.40732
                        - -0.58172
                        - 0.57673
                        dims:
                        - 0.3084
                        - 0.235
                        - 0.093
                    first_g: 6368
                    last_g: 6389
                    path2d:
                    - - 335.1
                      - 540.2
                    path3d:
                    - - -1.21
                      - -0.24
                      - 0.26
        '400':
          description: Bad parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_float:
                  summary: id is an integer
                  value:
                    error: id must be an integer
                    code: invalid_param
                    field: id
        '404':
          description: Not in this session's world.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_unknown:
                  summary: Not in the world
                  value:
                    error: no stone 999999 in the world
                    code: unknown_stone
                    field: id
        '503':
          description: The Stable sim is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_world_off:
                  summary: Stable sim off or restarting
                  value:
                    error: the Stable sim is not running
                    code: world_unavailable
                    retry_ms: 1000
      x-level: high
      x-sdk:
        go: c.API().GetStone(ctx, …)
        python: await factory.api.get_stone(…)
        rust: factory.api().get_stone(…).await
        typescript: await factory.api.getStone(…)
      description: 'One stone, with its path since the session began.


        **SDK** · Go `c.API().GetStone(ctx, …)` · Python `await factory.api.get_stone(…)` · Rust `factory.api().get_stone(…).await`
        · TypeScript `await factory.api.getStone(…)`'
  /api/v2/session/focus:
    get:
      operationId: getFocus
      tags:
      - Interpreter
      summary: The stone highlighted for every viewer, and its path.
      responses:
        '200':
          description: The focus, or nulls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusReply'
              examples:
                ok_none:
                  summary: Nothing highlighted
                  value:
                    focus: null
                    resolved: null
                ok_carried:
                  summary: A carried stone, with its path
                  value:
                    focus:
                      n: 421
                      session: 1794353523
                      video: aug28
                      id: 72
                      g: 6389
                      t: 1277.8
                      x: -1.2055
                      y: -0.2421
                      z: 0.2159
                      L: 0.3084
                      W: 0.235
                      yaw: -1.5602
                    resolved:
                      id: 72
                      path2d:
                      - - 335.1
                        - 540.2
                      path3d:
                      - - -1.21
                        - -0.24
                        - 0.26
        '400':
          $ref: '#/components/responses/BodyOnGet'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      x-level: high
      x-sdk:
        go: c.API().GetFocus(ctx, …)
        python: await factory.api.get_focus(…)
        rust: factory.api().get_focus(…).await
        typescript: await factory.api.getFocus(…)
      description: 'The stone highlighted for every viewer, and its path.


        **SDK** · Go `c.API().GetFocus(ctx, …)` · Python `await factory.api.get_focus(…)` · Rust `factory.api().get_focus(…).await`
        · TypeScript `await factory.api.getFocus(…)`'
    put:
      operationId: putFocus
      tags:
      - Interpreter
      summary: Highlight a stone of the world for every viewer.
      x-mutates-session: true
      parameters:
      - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusRequest'
            examples:
              ok_carried_stone:
                summary: The stone being carried
                value:
                  stone_id: 72
              ok_pinned:
                summary: As drawn at g 6389 of this session
                value:
                  stone_id: 72
                  g: 6389
                  session: 1794353523
              bad_unknown_stone:
                summary: Not in the world
                value:
                  stone_id: 999999
              bad_float_id:
                summary: An id is an integer
                value:
                  stone_id: 7.5
              bad_old_session:
                summary: Clicked just before a seek
                value:
                  stone_id: 72
                  session: 1794353000
      responses:
        '200':
          description: The focus is set (or, with dry_run, validated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlReply'
              examples:
                ok_carried_stone:
                  summary: The highlight is shared
                  value:
                    state:
                      session: 1794353523
                      revision: 421
                      video: aug28
                      playing: false
                      rate: 0.8
                      anchor_media: 1277.8
                      anchor_wall: 1794353610.1
                      hold_until: 1794353602.882
                      duration: 3711.816667
                      changed_by: viewer
                      focus:
                        n: 421
                        session: 1794353523
                        video: aug28
                        id: 72
                        g: 6389
                        t: 1277.8
                        x: -1.2055
                        y: -0.2421
                        z: 0.2159
                        L: 0.3084
                        W: 0.235
                        yaw: -1.5602
                      media_time: 1277.8
                    server_now: 1794353620.4
                    server_recv: 1794353620.399
                    dry_run: true
        '400':
          description: Bad body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_float_id:
                  summary: An id is an integer
                  value:
                    error: stone_id must be an integer within 0..1000000000
                    code: invalid_type
                    field: stone_id
                bad_no_id:
                  summary: stone_id is required
                  value:
                    error: stone_id must be an integer within 0..1000000000
                    code: missing_field
                    field: stone_id
                bad_malformed_json:
                  $ref: '#/components/examples/bad_malformed_json'
        '403':
          $ref: '#/components/responses/ForeignOrigin'
        '404':
          description: The stone is not in the world.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_unknown_stone:
                  summary: Not in the world
                  value:
                    error: no stone 999999 in the world
                    code: unknown_stone
                    field: stone_id
        '409':
          description: The focus was made for another session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_old_session:
                  summary: Clicked just before a seek
                  value:
