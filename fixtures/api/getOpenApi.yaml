        tensorrt:
          type:
          - string
          - 'null'
        engines:
          type: array
          items:
            $ref: '#/components/schemas/ModelEngine'
    Topology:
      type: object
      required:
      - schema
      - joints
      - never
      - bones
      - wrist
      - tips
      - actions
      - held
      - colors
      - grid
      properties:
        schema:
          const: top1
        joints:
