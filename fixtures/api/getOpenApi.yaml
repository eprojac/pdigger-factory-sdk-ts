              type: string
              enum:
              - template
              - contact
              - contact-now
        stones:
          type: object
          description: 'On a 4x packet (`source: hr4`: every packet a unit with build claude-20261122-hr4x1 or later writes)
            the stone head at 4x resolution: fg on `grid` ([160, 256]) and tray on `tray_grid` ([80, 128]) of the stone crop,
            with the instances (items, count, and each hand''s `stone`) found on the base lattice `centre_grid` ([20, 32]).
            A base-decode packet (no `source`: a replayed older recording, as in the `ok_carry` example of `GET /api/v2/raw/packets/{g}`)
            has `grid` [40, 64] and `tray_grid` [20, 32]. Read every map''s size from its own grid.'
          properties:
            present:
              type: boolean
            count:
