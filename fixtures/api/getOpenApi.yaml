    SpeckleFind:
      type: object
      description: One stone of one moment, as the speckle check found it at the other moment.
      required:
      - id
      - at
      - score
      - second
      properties:
        id:
          type: integer
          description: The stone's world id at its own moment.
        at:
          oneOf:
          - type: integer
          - type: 'null'
          description: The world id of the stone (not held) at the other moment whose outline holds the centre of the best
            place; null when no outline holds it, or when the stone could not be checked.
        score:
          oneOf:
          - type: number
            minimum: -1
            maximum: 1
          - type: 'null'
          description: 'Zero-mean normalised cross-correlation (OpenCV''s TM_CCOEFF_NORMED) of the best place, the highest
            over the ten turned templates (0 and 180 degrees, each by -4, -2, 0, 2 and 4 degrees). null: the stone was not
            checked: its inner box is under 8 px a side or does not fit in the region.'
        second:
          oneOf:
          - type: number
            minimum: -1
            maximum: 1
          - type: 'null'
          description: 'The best place of the same template outside the best''s template-sized neighbourhood among the refined
            candidates (-1: none). A find is clean when score >= 0.30 and score >= 2 x second; score - second is its margin.'
    WorldSpeckle:
      type: object
      description: 'The speckle stone identification of one tray: sent once, in the world of the first frame after the unit''s
        GPU answered (and again in that frame''s revisions). The reference is the tray''s arrival (its first frame with calm
        >= 3, quiet >= 5 and every stone confirmed), or the first later calm frame of the tray when the arrival''s could not
        be kept; `at` is a later calm frame of the tray: a calm moment (at most one a minute) or the last calm frame before
        the visit ended. Nothing is matched while the unit''s speckle service does not run. Every stone not held at either
        moment is checked at the other by its speckle: the full-resolution luma of the interpreted crop, high-passed (minus
        its Gaussian blur of sigma 2.5 px); its template is the inner 62 % of its outline''s box (for a stone whose box is
        too large for the unit''s GPU kernels, wider or higher than 192 px or larger than about 140 x 140 px, such as a long
        kerb: the central part of that box the kernels take, shaved from its longer side). It is checked where the other moment''s
        stones (not held) are, centred on each one''s inner box and up to 24 px off, and at its own place, up to 40 px off;
        coarse to fine: the whole template on the band image''s even pixels, the 3 best places per turn (0 or 180 degrees)
        refined within 2 px at full resolution with that turn''s five angles. A stone whose best refined place scores under
        0.30 is also looked for anywhere within 128 px of its own place (up to 8 more places per turn). Everything stays within
        the box of both moments'' outlines widened by 60 px.'
      required:
      - v
      - tray
      - ref
      - at
      - device
      - gpu_ms
      - wall_ms
      - stones
      - refs
      - pairs
      properties:
        v:
          const: 1
          description: The version of the answer's format.
        tray:
          type: integer
          minimum: 1
          description: 'The unit''s count of trays in this session: it reads stops, visits, trays and their arrival as SDK-DESIGN
            4.6.1 does, without its pauses for an incomplete inventory or a brief omission, so its frames are nearly always
            the SDK''s.'
        ref:
          type: object
          required:
          - g
          - t
          properties:
            g:
              type: integer
            t:
              type: number
          description: The reference moment, the tray's arrival (or the first later calm frame that could be kept).
        at:
          type: object
          required:
          - g
          - t
          properties:
            g:
              type: integer
            t:
              type: number
          description: The matched moment, a later calm frame of the tray.
        device:
          type: string
          description: The GPU the check ran on, as CUDA names it, with its compute capability and multiprocessors.
        gpu_ms:
          type: number
          description: GPU time of the two checks (one per direction).
        wall_ms:
          type: number
          description: 'Time the unit''s speckle service spent on the request: the checks, paced to at most a quarter of the
            GPU.'
        stones:
          type: array
          items:
            $ref: '#/components/schemas/SpeckleFind'
          description: Every stone not held at `at`, in world order, checked at the reference.
        refs:
          type: array
          items:
            $ref: '#/components/schemas/SpeckleFind'
          description: Every stone not held at the reference, in world order, checked at `at`.
        pairs:
          type: array
          items:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2
          description: '[id at `at`, id at the reference], by the first id: a clean find from one lands on the other and the
            find from the other, when clean, lands on the first; a stone in a contradiction, or paired twice, is in no pair.'
    WorldLayer:
