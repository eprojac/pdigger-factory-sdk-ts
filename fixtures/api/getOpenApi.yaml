components:
  headers:
    XInterpBuild:
      description: The build that answered.
      schema:
        type: string
    ETag:
      description: Entity tag.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait, at least 1.
      schema:
        type: integer
  parameters:
    DryRun:
      name: dry_run
      in: query
      description: 1 validates and answers without moving the session. Charged only to the per-IP rate limit.
      schema:
        type: integer
        enum:
        - 0
        - 1
        default: 0
      examples:
        ok_validate_only:
          value: 1
          summary: Validate and answer
        ok_apply:
          value: 0
          summary: Apply for every viewer
    VideoId:
      name: id
      in: path
      required: true
      description: Catalog id.
      schema:
        type: string
      examples:
        ok_aug28:
          value: aug28
          summary: Line A 28 Aug
        bad_unknown:
          value: nope
          summary: Not in the catalog
    Range:
      name: Range
      in: header
      description: A single byte range.
      schema:
        type: string
      examples:
        ok_first_kilobyte:
          value: bytes=0-1023
          summary: The first KiB
        bad_past_end:
          value: bytes=99999999999-
          summary: Starts after the end
        bad_two_ranges:
          value: bytes=0-1,5-6
          summary: Multiple ranges are not supported
    IfRange:
      name: If-Range
      in: header
      description: ETag or Last-Modified of the previous reply.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag of a cached copy.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: The last cursor this client has. A value ahead of the server is clamped.
      schema:
        type: integer
        minimum: 0
        default: 0
      examples:
        ok_from_start:
          value: 0
          summary: From the newest frames
        bad_cursor:
          value: 12a
          summary: Not an integer
    Rev:
      name: rev
      in: query
      description: The last state revision this client has. 0 returns at once.
      schema:
        type: integer
        minimum: 0
        default: 0
    Cid:
      name: cid
      in: query
      description: A per-tab id (`^[A-Za-z0-9_-]{8,40}$`). Counts this client as a viewer.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,40}$
      examples:
        ok_tab_id:
          value: Yz3kPq7LwR2sT9vB
          summary: One id per tab
    Layers:
      name: layers
      in: query
      description: Comma-separated subset of `raw`, `overlay`, `scene`, `cards`, `world`. Default `overlay,scene,cards,world`.
      schema:
        type: string
        default: overlay,scene,cards,world
      examples:
        ok_portal_bundle:
          value: overlay,scene,cards,world
          summary: What the portal uses
        ok_world:
          value: world
          summary: Only the cleaned-up world
        ok_raw:
          value: raw
          summary: The codec packet
        bad_unknown_layer:
          value: foo
          summary: Not a layer
    Limit:
      name: limit
      in: query
      description: At most this many newest frames per reply.
      schema:
        type: integer
        minimum: 1
        maximum: 16
        default: 8
      examples:
        ok_eight:
          value: 8
          summary: Same as the legacy long-poll
        bad_limit:
          value: 99
          summary: Above 16
    WaitMs:
      name: wait
      in: query
      description: Longest wait in ms.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
        default: 1000
      examples:
        ok_no_wait:
          value: 0
          summary: Return at once
        bad_wait:
          value: 5000
          summary: Above 1000
    Precision:
      name: precision
      in: query
      description: '`rounded` (default): outline .01 px, solid 1e-4, q 1e-5. `full`: unrounded, for parity runs.'
      schema:
        type: string
        enum:
        - rounded
        - full
        default: rounded
      examples:
        ok_full:
          value: full
          summary: Unrounded
        bad_precision:
          value: exact
          summary: Not a mode
    SessionGuard:
      name: session
      in: query
      description: Answer 410 if this is not the current session. Protects a reader from another viewer's seek.
      schema:
        type: integer
      examples:
        ok_current:
          value: 1794353523
          summary: The current session
        bad_old:
          value: 1794353000
          summary: An earlier session
    GridFrame:
      name: g
      in: path
      required: true
      description: Grid frame index.
      schema:
        type: integer
        minimum: 0
      examples:
        ok_carry:
          value: 6389
          summary: The lift on aug28
        bad_not_a_number:
          value: abc
          summary: Not an integer
    GridFrameOrLatest:
      name: g
      in: path
      required: true
      description: Grid frame index, or `latest`.
      schema:
        type: string
        pattern: ^(latest|[0-9]{1,10})$
      examples:
        ok_carry:
          value: '6389'
          summary: The lift on aug28
        ok_latest:
          value: latest
          summary: The newest frame
        bad_not_retained:
          value: '0'
          summary: Outside the retained window
        bad_not_a_number:
          value: abc
          summary: Not an integer
    After:
      name: after
      in: query
      description: Start after this cursor. Default the newest.
      schema:
        type: integer
        minimum: 0
    StreamFormat:
      name: format
      in: query
      description: Overrides the `Accept` header.
      schema:
        type: string
        enum:
        - ndjson
        - sse
      examples:
        ok_ndjson:
          value: ndjson
          summary: One JSON document per line
        ok_sse:
          value: sse
          summary: Server-sent events
        bad_format:
          value: xml
          summary: Not a format
    StreamLimit:
      name: limit
      in: query
      description: End the stream after this many frames.
      schema:
        type: integer
        minimum: 1
        maximum: 4096
      examples:
        ok_four:
          value: 4
          summary: Four frames and stop
        bad_zero:
          value: 0
          summary: Below 1
    StreamMaxS:
      name: max_s
      in: query
      description: End the stream after this many seconds.
      schema:
        type: integer
        minimum: 1
        maximum: 3600
      examples:
        ok_five:
          value: 5
          summary: Five seconds and stop
        bad_zero:
          value: 0
          summary: Below 1
    Observe:
      name: observe
      in: query
      description: 1 does not count this consumer as a viewer, so an idle system stays idle.
      schema:
        type: integer
        enum:
        - 0
        - 1
        default: 0
    LastEventId:
      name: Last-Event-ID
      in: header
      description: '`<boot>-<cursor>` of the last event. An id from another boot gets `reset`.'
      schema:
        type: string
    RenderG:
      name: g
      in: query
      description: A grid frame (exactly one of `g` and `t`).
      schema:
        type: integer
        minimum: 0
      examples:
        ok_carry:
          value: 6389
          summary: The lift on aug28
    RenderT:
      name: t
      in: query
      description: A media time in seconds (exactly one of `g` and `t`).
      schema:
        type: number
        minimum: 0
      examples:
        ok_between_packets:
          value: 1277.9
          summary: Half way between two packets
        bad_outside_window:
          value: 5.0
          summary: No retained frame there
    RenderMode:
      name: mode
      in: query
      description: '`stable`: the persistent world. `raw`: per-packet detections.'
      schema:
        type: string
        enum:
        - stable
        - raw
        default: stable
      examples:
        ok_stable:
          value: stable
          summary: The cleaned-up world
        ok_raw:
          value: raw
          summary: Raw detections
        bad_mode:
          value: best
          summary: Not a mode
    RenderDraw:
      name: draw
      in: query
      description: '`shapes`: semantic objects. `primitives`: flat lists with resolved styles.'
      schema:
        type: string
        enum:
        - shapes
        - primitives
        default: shapes
      examples:
        ok_shapes:
          value: shapes
          summary: Stones, skeleton, wrists
        ok_primitives:
          value: primitives
          summary: Polygons, segments, circles
        bad_draw:
          value: svg
          summary: Not a form
    RenderSurface:
      name: surface
      in: query
      description: '`vertices`: explicit f32 positions and u16 indices. `compact`: quantised log depth plus masks. `none`:
        omit.'
      schema:
        type: string
        enum:
        - vertices
        - compact
        - none
        default: vertices
      examples:
        ok_vertices:
          value: vertices
          summary: An explicit mesh
        ok_none:
          value: none
          summary: Omit the surface
        bad_surface:
          value: mesh
          summary: Not a form
  examples:
    bad_malformed_json:
      summary: Not JSON
      value:
        error: invalid JSON
        code: invalid_json
    bad_get_with_body:
      summary: A body on GET is refused and the connection closed
      description: curl -X GET --data x http://HOST:8120/api/v2/health
      value:
        error: a GET request cannot carry a body
        code: body_not_allowed
    bad_method_not_allowed:
      summary: A method the path does not have
      value:
        error: method not allowed
        code: method_not_allowed
    bad_foreign_origin:
      summary: A cross-origin request
      description: 'curl -X POST -H ''Origin: http://evil.example'' -H ''Content-Type: application/json'' -d ''{}'' http://HOST:8120/api/v2/session/pause'
      value:
        error: cross-origin control refused
        code: cross_origin
    bad_foreign_origin_no_body:
      summary: A cross-origin DELETE
      description: 'curl -X DELETE -H ''Origin: http://evil.example'' http://HOST:8120/api/v2/session/focus'
      value:
        error: cross-origin control refused
        code: cross_origin
    bad_too_large:
      summary: 600 bytes
      value:
        error: body must be 1..512 bytes
        code: body_too_large
    bad_text_plain:
      summary: text/plain
      value:
        error: JSON only
        code: json_only
    bad_too_soon_session:
      summary: Twice within a second
      value:
        error: too many controls; wait a moment
        code: too_many_controls
        retry_ms: 800
    bad_too_soon_play:
      summary: Twice within 0.3 s
      value:
        error: too many controls; wait a moment
        code: too_many_controls
        retry_ms: 300
    bad_too_soon_focus:
      summary: Twice within 0.15 s
      value:
        error: too many controls; wait a moment
        code: too_many_controls
        retry_ms: 150
    bad_too_soon_focus_no_body:
      summary: Twice within 0.15 s
      value:
        error: too many controls; wait a moment
        code: too_many_controls
        retry_ms: 150
  responses:
    BodyOnGet:
      description: A GET with a body is refused and the connection closed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bad_get_with_body:
              $ref: '#/components/examples/bad_get_with_body'
    MethodNotAllowed:
      description: A method this path does not have.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bad_method_not_allowed:
              $ref: '#/components/examples/bad_method_not_allowed'
    ForeignOrigin:
      description: A foreign `Origin`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bad_foreign_origin:
              $ref: '#/components/examples/bad_foreign_origin'
    ForeignOriginNoBody:
      description: A foreign `Origin`.
