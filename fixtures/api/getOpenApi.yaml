              description: the masks, tray and yaw come from the 4x stone outputs
            centres:
              type: string
              enum:
              - base
              description: the instances come from the base centre peaks
            centre_grid:
              type: array
              items:
                type: integer
              description: rows, cols of the lattice the instances are found on (20, 32)
        tray:
          type: object
          properties:
            valid:
              type: boolean
            normal:
              type: array
              items:
                type: number
            d:
              type: number
            anchor:
              type: string
            floor:
              type: number
            floor_anchor:
              type: string
        hands:
          type: object
          properties:
            left:
              $ref: '#/components/schemas/Sip1Hand'
            right:
              $ref: '#/components/schemas/Sip1Hand'
        both:
          type: number
        session:
          type: integer
        video:
          type: string
        g:
          type: integer
        i:
          type: integer
        t:
          type: number
        past_valid:
          type: boolean
        dt_past:
          type: number
