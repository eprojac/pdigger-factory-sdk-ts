    Sip1Packet:
      type: object
      description: 'The model codec packet (`schema` = `sip1`), the worker''s bytes with `cursor` spliced in. Maps are base64
        of zlib of u8 row-major.

        `person.joints[j]` = `[u, v, vis, x, y, z]` or null, 70 entries, `x,y,z` camera-frame template metres.

        `stones.items[k]` = `[u, v, w, h, score, X, Y, Z, w_m, h_m, yaw]`.

        '
      required:
      - schema
      - maps
      - depth
      - boxes
      - person
