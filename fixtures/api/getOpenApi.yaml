            box:
              type: array
              items:
                type: number
            rot:
              type: boolean
            grid:
              type: array
              items:
                type: integer
            mask:
              type: string
            alpha:
              type: string
            joints:
              type: array
              maxItems: 70
              items:
                oneOf:
                - type: array
