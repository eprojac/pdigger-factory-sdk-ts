          const: 70
        never:
          type: array
          items:
            type: integer
        wrist:
          type: object
          properties:
            left:
              type: integer
            right:
              type: integer
        tips:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
        bones:
          type: array
          items:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2
        actions:
          type: array
          items:
