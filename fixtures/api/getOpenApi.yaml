      - length_required
      - body_too_large
      - body_not_allowed
      - cross_origin
      - json_only
      - too_many_controls
      - too_many_requests
      - too_many_viewers
      - too_many_streams
      - unknown_video
      - time_out_of_range
      - invalid_type
      - missing_field
      - invalid_param
      - unknown_layer
      - not_retained
      - session_gone
      - stale_session
      - unknown_stone
      - world_unavailable
      - debug_disabled
      - busy
      - not_ready
      - not_found
      - method_not_allowed
      - internal
      - not_seekable
