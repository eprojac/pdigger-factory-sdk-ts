            lo:
              type: number
            hi:
              type: number
            a:
              type: number
            b:
              type: number
            anchor:
              type: string
        boxes:
          type: object
          properties:
            stone:
              type: array
              description: x0,y0,x1,y1,rot,presence
            person:
