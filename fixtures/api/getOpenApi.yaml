  /api/v2/session/frames/stream:
    get:
      operationId: streamFrames
      tags:
      - Streams
      summary: The same frames pushed, as SSE or NDJSON.
      description: 'SSE events: `frame` (data = Frame, id = `<boot>-<cursor>`), `clock`, `worker`, `reset`, `gap`, with the
        data of `raw/stream`''s.

        `Last-Event-ID` resumes inside the retained window; an id of another boot gets `reset` and continues from the newest.

        With the `world` layer, a frame whose world was revised (a paused frame refined, `world.rev` higher) is sent again
        as a

        `frame` event with the newest world; its id is the revision''s cursor, its data the frame with its own `cursor`. A
        stream

        gets each revision once: one that reads the frame at its packet after the revision already has it, and is not sent
        it

        again.


        **SDK** · Go `c.API().StreamFrames(ctx, …)` · Python `await factory.api.stream_frames(…)` · Rust `factory.api().stream_frames(…).await`
        · TypeScript `await factory.api.streamFrames(…)`


        **High level** · Python `async for update in factory.interpreter().updates()` · TypeScript `for await (const update
        of factory.interpreter().updates())`'
      parameters:
      - $ref: '#/components/parameters/Layers'
      - $ref: '#/components/parameters/StreamFormat'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/StreamLimit'
      - $ref: '#/components/parameters/StreamMaxS'
      - $ref: '#/components/parameters/Observe'
      - $ref: '#/components/parameters/Precision'
      - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: The stream. Ends after `limit` frames or `max_s` seconds.
          content:
            text/event-stream:
              schema:
                type: string
              x-item-schema: Frame
              x-event-schemas:
                clock: ClockEvent
                worker: WorkerStatus
                reset: ResetEvent
                gap: GapEvent
              examples:
                ok_sse_world:
                  summary: World snapshots as events
                  value: 'id: b7f3a2c1-918

                    event: frame

                    data: {"cursor":918,"session":1794353523,"video":"aug28","g":6389,"world":{...}}


                    '
            application/x-ndjson:
              schema:
                type: string
                description: One Frame per line.
              x-item-schema: Frame
              examples:
                ok_ndjson_cards:
                  summary: Cards as NDJSON
                  value: '{"cursor":918,"g":6389,"cards":{...}}

                    '
        '400':
          description: Bad parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_unknown_layer:
                  summary: Not a layer
                  value:
                    error: unknown layer 'foo'
                    code: unknown_layer
                    field: layers
                bad_max_s:
                  summary: max_s is 1..3600
                  value:
                    error: max_s must be within 1..3600
                    code: invalid_param
                    field: max_s
        '503':
          description: Too many streams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_too_many_streams:
                  summary: 32 streams are open
                  value:
                    error: too many streams right now
                    code: too_many_streams
                    retry_ms: 2000
      x-level: mid
      x-sdk:
        go: c.API().StreamFrames(ctx, …)
        python: await factory.api.stream_frames(…)
        rust: factory.api().stream_frames(…).await
        typescript: await factory.api.streamFrames(…)
        high:
          go: interp := c.Interpreter(); for u, err := range interp.Updates(ctx)
          python: async for update in factory.interpreter().updates()
          rust: factory.interpreter().updates().await?
          typescript: for await (const update of factory.interpreter().updates())
  /api/v2/session/frames:
    get:
      operationId: pollFrames
      tags:
      - Streams
      summary: Long-poll for new frames. This is what the portal uses.
      description: 'Returns as soon as a frame newer than `cursor` is released for the requested layers or the state revision
        differs from `rev`,

        else after `wait` ms. A `cursor` or `rev` ahead of the server is clamped. At most `limit` newest frames.

        With the `world` layer, a frame whose world was revised since (a paused frame refined, `world.rev` higher) comes again,

        with the newest world: its `cursor` is its packet''s, the reply''s `cursor` moves past the revision. Keep the frame
        of the

        newest `world.rev` per `g`; continue from the reply''s `cursor`, never from a frame''s.


        **SDK** · Go `c.API().PollFrames(ctx, …)` · Python `await factory.api.poll_frames(…)` · Rust `factory.api().poll_frames(…).await`
        · TypeScript `await factory.api.pollFrames(…)`'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Rev'
      - $ref: '#/components/parameters/Cid'
      - $ref: '#/components/parameters/Layers'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/WaitMs'
      - $ref: '#/components/parameters/Precision'
