  /api/v2/session/world:
    get:
      operationId: getWorld
      tags:
      - Interpreter
      summary: The newest world.
      description: 'The world of the newest retained frame that has one, at its newest revision (`rev`).


        **SDK** · Go `c.API().GetWorld(ctx, …)` · Python `await factory.api.get_world(…)` · Rust `factory.api().get_world(…).await`
        · TypeScript `await factory.api.getWorld(…)`'
      parameters:
      - $ref: '#/components/parameters/Precision'
      responses:
        '200':
          description: The world of the newest frame that has one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldLayer'
              examples:
                ok_newest:
                  summary: Stones, hands, events and stats
                  value:
                    schema: stw1
                    session: 1794353523
                    video: aug28
                    g: 6389
                    t: 1277.8
                    motion: static
                    logF: -0.08459
                    stones:
                    - id: 72
                      mode: carry
                      family: dogbone
                      shape: model
                      detected: false
                      uncertain: false
                      side: right
                      outline:
                      - - 372.05
                        - 474.42
                      - - 372.11
                        - 497.61
                      - - 362.88
                        - 511.3
                      solid:
                        pos:
                        - -1.2055
                        - -0.2421
                        - 0.2159
                        q:
                        - -0.40383
                        - 0.40732
                        - -0.58172
                        - 0.57673
                        dims:
                        - 0.3084
                        - 0.235
                        - 0.093
                    - id: 39
