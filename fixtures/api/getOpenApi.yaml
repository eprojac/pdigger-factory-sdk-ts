        held:
          type: array
          items:
            type: string
        colors:
          type: object
          additionalProperties:
            type: string
        grid:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
    Camera:
      type: object
      properties:
        K:
          type: array
          items:
            type: array
            items:
              type: number
        R_c2w:
          type: array
          items:
            type: array
            items:
              type: number
        t_c2w:
          type: array
          items:
            type: number
        gauge:
          type: string
        calibrated:
          type: boolean
    VideoEntry:
      type: object
      description: 'A source of the shared session: a recording, or a live camera (`kind: camera`, `live: true`, `seekable:
        false`; `duration`, `frames` and `default_start` null). An entry without `kind`, `live` or `seekable` (the recordings
        omit them) is a seekable recording; a client fills a missing one from the others (`kind: camera` alone: live, not
        seekable).'
      required:
      - id
      - duration
      - fps
      - frames
      - grid_step
      - proxy
      - proxy_wh
      - native_wh
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        duration:
          type:
          - number
          - 'null'
          description: Null for a live camera.
        fps:
          type: number
          description: 'A camera: the grid it is said to run on; its frames come as they arrive.'
        frames:
          type:
          - integer
          - 'null'
          description: Null for a live camera.
        grid_step:
          type: integer
        default_start:
          type:
          - number
          - 'null'
          description: Null for a live camera.
        hold:
          type: number
          description: 'Seconds the playhead holds after a select or seek while the worker warms up; on a camera, the warm-up:
            seconds of camera frames the interpreter runs on before the first is shown.'
        proxy:
          type: string
          description: URL of the proxy video; empty for a live camera.
        proxy_wh:
          type: array
          items:
            type: integer
        native_wh:
          type: array
          items:
            type: integer
        source_wh:
          type: array
          items:
            type: integer
        crop:
          type: array
          items:
            type: integer
        profile:
          type: string
        camera:
          $ref: '#/components/schemas/Camera'
        held_out:
          type: array
          items:
            type: array
            items:
              type: number
        stone_model:
          type: object
          additionalProperties: true
        kind:
          type: string
          enum:
          - recording
          - camera
          default: recording
          description: '`camera`: a live camera. Absent: a recording.'
        live:
          type: boolean
          default: false
          description: 'True for a live camera: no duration, no seek, rate 1.0.'
        seekable:
          type: boolean
          default: true
        station:
          type: string
          description: 'A camera: the plant station its rig belongs to (for example `Plant A`).'
    VideoList:
      type: object
      required:
      - schema
      - videos
      properties:
        schema:
          type: string
        title:
          type: string
        default_video:
          type: string
        model:
          type: object
          additionalProperties: true
        videos:
          type: array
          items:
            $ref: '#/components/schemas/VideoEntry'
    Focus:
      type: object
      description: The shared stone focus, in the shape every viewer since v1 understands.
      required:
      - n
      - session
      - video
      - id
      - g
      - t
      - x
      - y
      - z
      - L
      - W
      - yaw
      properties:
        n:
          type: integer
        session:
          type: integer
        video:
          type: string
        id:
          type: integer
        g:
          type: integer
        t:
          type: number
        x:
          type: number
        y:
          type: number
        z:
          type: number
        L:
          type: number
        W:
          type: number
        yaw:
          type: number
    State:
      type: object
      required:
      - session
      - revision
      - video
      - playing
      - rate
      - anchor_media
      - anchor_wall
      - hold_until
      - duration
      - changed_by
      - focus
      - media_time
      properties:
        session:
          type: integer
        revision:
          type: integer
        video:
          type: string
        playing:
          type: boolean
        rate:
          type: number
          minimum: 0.3
          maximum: 1.0
        anchor_media:
          type: number
        anchor_wall:
          type: number
          description: Epoch seconds on the server's wall clock.
        hold_until:
          type: number
          description: 'The playhead stands still until then. On a camera: an hour ahead until the session first goes live,
            then the moment it last went live (a later warm-up leaves it there).'
        duration:
          type:
          - number
          - 'null'
          description: Null on a live camera.
        changed_by:
          type: string
          enum:
          - start
          - viewer
          - auto-rate
          - end-of-video
        focus:
          oneOf:
          - $ref: '#/components/schemas/Focus'
          - type: 'null'
        media_time:
          type: number
          description: 'Seconds into the source. On a live camera: 0 until the session first goes live, then now - since -
            lag, running on through a later warm-up and standing still while paused; `live.phase` says whether frames are
            live.'
        live:
          $ref: '#/components/schemas/Live'
    Live:
      type: object
      description: 'Only on a live camera session. `connecting`: no camera frame yet, after every play, and whenever a playing

        session''s stream stopped (no frame for 5 s: the camera, its connection, or a worker that let it go; the worker''s
        reason

        says why). `warming`: the interpreter runs on the camera, nothing is released; after `warmup` seconds of frames

        it goes `live` and the frames that follow are released, from a warm world. Any break in the stream (frames lost,

        a stream that stopped, a pause) warms up again. Each phase change bumps `revision`, so long polls and the `clock`

        SSE event carry it. The worker interprets a camera only while someone watches it: a page or stream, or a client

        that sent a control in the last 15 s; with nobody for 20 s more it lets the camera go (the session connects again

        when someone comes back).

        '
      required:
      - phase
      - warmup
      - since
      - lag
      properties:
        phase:
          type: string
          enum:
          - connecting
          - warming
          - live
        warmup:
          type: number
          description: Seconds of camera frames interpreted before any is shown.
        since:
          type: number
          description: Epoch seconds the session started; a frame's t is its arrival in seconds since then.
        lag:
          type: number
          description: Seconds the shown picture is behind its arrival, interpreter included, when the session last went live;
            play resumes at now - since - lag.
    WorkerStatus:
      type: object
      required:
      - state
      - reason
      properties:
        state:
          type: string
          enum:
          - running
          - idle
          - waiting
          - starting
          - offline
          - error
          - paused
        reason:
          type: string
          description: 'A fixed phrase. On a live camera, while running: `connecting to the camera`, `the camera is not answering`,
            `the camera''s pictures do not decode`, `paused on the camera`, or empty.'
        fps:
          type: number
        frame_ms:
          type:
          - number
          - 'null'
        cycle_ms:
          type:
          - number
          - 'null'
        session:
          type:
          - integer
          - 'null'
        g:
          type:
          - integer
          - 'null'
        gpu:
          type:
          - number
          - 'null'
        errors:
          type: integer
        stage_ms:
          type: object
          additionalProperties:
            type: number
        engines:
          type: object
          additionalProperties:
            type: string
        model:
          type: string
        video:
          type: string
    StableStatus:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - running
          - starting
          - failed
          - 'off'
          - unusable
        fits:
          type: integer
        evidence:
          type: boolean
          description: 'False: grey frames are missing, shapes come from the detections only.'
        message:
          type: string
        fixer:
          type: string
          enum:
          - legacy
          - thin-v1
          description: 'The Stable engine''s fixer (`--world-fixer`): `legacy` is the engine of the page before the API, `thin-v1`
            adds the thin-stone rules and the rest refinement of a paused frame.'
        hold:
          $ref: '#/components/schemas/HoldStatus'
    HoldStatus:
      type: object
      description: 'While the shared session is paused, the world host is held on the paused grid frame and refines it on
        its own image

        (fixer thin-v1). Each round that changes that frame''s world releases it again with `world.rev` one higher. The hold

        ends at play, select, a seek while playing, or a new session.

        '
      required:
      - session
      - g
      - state
      - rounds
      - rev
      - ms
      - resteps
      properties:
        session:
          type: integer
        g:
          type: integer
          description: 'The held grid frame: the grid frame of the paused media time. A page whose video is presented within
            20 ms of the paused time does not seek again, and when that crosses a grid frame''s start it shows the frame next
            to this one, which gets this frame''s refined world stepped again but no rounds of its own.'
        at:
          type: integer
          description: 'The frame refined, when it is not `g`: the worker skipped `g` (a frame dropped under load), and a
            page shows the newest frame before it in its place.'
        state:
          type: string
          enum:
          - waiting
          - running
          - converged
          - nothing
          - limit
          - time
          - 'off'
          - stale
          - nogray
          - failed
          - moved
          - released
          description: '`waiting` for the frame''s packet, `running`, or over: `converged` (nothing left to refine), `nothing`
            (nothing to refine there), `limit` and `time` (the round and time bounds), `off` (fixer legacy refines nothing),
            `stale` (the frame and every frame before it are gone from the engine), `nogray` (no grey frame), `failed`, `moved`
            (another hold came), `released`.'
        rounds:
          type: integer
          description: Refine rounds run.
        rev:
          type: integer
          minimum: 0
          description: The newest world revision of the frame.
        ms:
          type: number
          description: Wall time of the rounds.
        resteps:
          type: integer
          description: Packets after the held frame (the worker runs up to 0.6 s of media ahead of a paused playhead) stepped
            again from its refined world.
    SessionReply:
      type: object
      required:
      - server_now
      - server_recv
      - state
      - worker
      - viewers
      - stable
      properties:
        server_now:
          type: number
        server_recv:
          type: number
        state:
          $ref: '#/components/schemas/State'
        worker:
          $ref: '#/components/schemas/WorkerStatus'
        viewers:
          type: integer
        stable:
          $ref: '#/components/schemas/StableStatus'
    SelectRequest:
      type: object
      description: '`video` is a source id. For a camera leave `time` out (any `time`, null too: 400 `not_seekable`, field
        `time`): the session starts on it, connecting, then warming up, then live. A select that is not a dry run counts its
        client as a viewer for 15 s, so the worker wakes for it.'
      required:
      - video
      properties:
        video:
          type: string
        time:
          type: number
          minimum: 0
    SeekRequest:
      type: object
      required:
