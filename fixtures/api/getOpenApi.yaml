  /api/v2/session/frames/{g}/image.jpg:
    get:
      operationId: getFramePicture
      tags:
      - Frames and codec
      summary: A live camera frame's own picture, the JPEG it was interpreted on.
      description: 'Only on a live camera session: the camera''s JPEG of a released frame (`latest` for the newest), as it
        arrived

        (640 x 360 on the plant rigs; the overlay''s native pixels are that picture stretched to `native_wh`). The worker

        keeps the pictures of the newest 64 frames only (about 17 s of a camera at 3.8 frames a second), fewer than the

        frames retained: an older frame''s picture is `404 not_retained`. `X-Interp-G` names the frame the picture is of.

        Warm-up frames are never released. A recording''s picture is its proxy video.


        **SDK** · Go `c.API().GetFramePicture(ctx, …)` · Python `await factory.api.get_frame_picture(…)` · Rust `factory.api().get_frame_picture(…).await`
        · TypeScript `await factory.api.getFramePicture(…)`


        **High level** · Python `await factory.session.picture(update.g)` · TypeScript `await factory.session.picture(update.g)`'
      parameters:
      - $ref: '#/components/parameters/GridFrameOrLatest'
      - $ref: '#/components/parameters/SessionGuard'
      responses:
        '200':
          description: The JPEG.
          headers:
            X-Interp-G:
              description: The grid frame the picture is of (the newest for `latest`).
              schema:
                type: integer
            Cache-Control:
              description: '`no-store`.'
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
              examples:
                ok_latest:
                  summary: The newest camera picture
                  value: <binary JPEG>
        '400':
          description: Bad parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_g:
                  summary: g is an integer or latest
                  value:
                    error: g must be an integer or latest
                    code: invalid_param
                    field: g
        '404':
          description: 'A recording (`not_found`), a frame that is not retained, or a retained frame whose picture is no longer
            kept

            (`not_retained`; the latter without a `retained` window).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_recording:
                  summary: The session plays a recording
                  value:
                    error: 'aug28 is a recording: its picture is the proxy video'
                    code: not_found
                    field: g
        '410':
          description: The session asked for has ended (whatever it showed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_session_gone:
                  summary: Another viewer switched the session since
                  value:
                    error: session 1794353000 has ended
                    code: session_gone
                    field: session
      x-level: low
      x-sdk:
        go: c.API().GetFramePicture(ctx, …)
        python: await factory.api.get_frame_picture(…)
        rust: factory.api().get_frame_picture(…).await
        typescript: await factory.api.getFramePicture(…)
        high:
          go: c.Session().Picture(ctx, pdiggerfactory.FrameAt(u.Frame.G))
          python: await factory.session.picture(update.g)
          rust: factory.session().picture(frame.g).await?
          typescript: await factory.session.picture(update.g)
