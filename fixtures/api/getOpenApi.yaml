  /api/v2/raw/stream:
    get:
      operationId: rawStream
      tags:
      - Streams
      summary: The raw model codec stream.
      description: 'One `sip1` packet per line, with no envelope (NDJSON), or SSE with `Accept: text/event-stream` or `format=sse`.

        SSE events: `frame` (data = the packet, id = `<boot>-<cursor>`), `clock`, `worker`, `reset`, `gap`.

        Their data: `clock` the shared state with `server_now` (ClockEvent), `worker` a WorkerStatus, `reset` `{boot, cursor}`,
        `gap` `{gap}`.

        A slow consumer skips the oldest and gets `gap` (NDJSON: a line `{"gap":n}`).

        A consumer counts as a viewer and keeps the GPU working unless `observe=1`.


        **SDK** · Go `c.API().RawStream(ctx, …)` · Python `await factory.api.raw_stream(…)` · Rust `factory.api().raw_stream(…).await`
        · TypeScript `await factory.api.rawStream(…)`'
      parameters:
      - $ref: '#/components/parameters/StreamFormat'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/StreamLimit'
      - $ref: '#/components/parameters/StreamMaxS'
      - $ref: '#/components/parameters/Observe'
      - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: The stream. Ends after `limit` packets or `max_s` seconds.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One Sip1Packet per line.
              x-item-schema: Sip1Packet
              examples:
                ok_four_packets:
                  summary: Four packets and stop
                  value: '{"schema":"sip1","maps":{...},"session":1794353523,"video":"aug28","g":6389,"i":76668,"t":1277.8,"past_valid":true,"dt_past":0.6,"ms":{...},"cursor":918}

                    {"schema":"sip1","maps":{...},"session":1794353523,"video":"aug28","g":6390,"i":76680,"t":1278.0,"past_valid":true,"dt_past":0.6,"ms":{...},"cursor":919}

                    '
            text/event-stream:
              schema:
                type: string
              x-item-schema: Sip1Packet
              x-event-schemas:
                clock: ClockEvent
                worker: WorkerStatus
                reset: ResetEvent
                gap: GapEvent
              examples:
                ok_sse:
                  summary: Server-sent events
                  value: 'id: b7f3a2c1-918

                    event: frame

                    data: {"schema":"sip1","g":6389,...}


                    event: clock

                    data: {"revision":418,"media_time":1278.1}


                    '
        '400':
          description: Bad parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_limit_zero:
                  summary: limit must be 1..4096
                  value:
                    error: limit must be within 1..4096
                    code: invalid_param
                    field: limit
                bad_format:
                  summary: Only ndjson and sse
                  value:
                    error: format must be ndjson or sse
                    code: invalid_param
                    field: format
                bad_after:
                  summary: after is a cursor
                  value:
                    error: after must be an integer
                    code: invalid_param
                    field: after
        '503':
          description: Too many streams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_too_many_streams:
                  summary: 32 streams are open
                  value:
                    error: too many streams right now
                    code: too_many_streams
                    retry_ms: 2000
      x-level: low
      x-sdk:
        go: c.API().RawStream(ctx, …)
        python: await factory.api.raw_stream(…)
        rust: factory.api().raw_stream(…).await
        typescript: await factory.api.rawStream(…)
