openapi: 3.1.0
info:
  title: pDigger Factory API
  version: 2.2.0
  summary: 'Interpreted stone work from a factory camera: events, stones and hands, as streams and as final draw lists.'
  description: 'The pDigger Factory API interprets stone work from a camera on the line: who handles which stone, when it
    is lifted,

    carried, put down or pushed, and where every stone is, as a persistent 3-D world. It runs on a Jetson Orin NX next to

    the camera and serves one **shared session** that every client follows.


    **Live cameras.** The plant cameras are listed with the recordings in `GET /api/v2/videos` (`kind: camera`,

    `live: true`, `seekable: false`, no duration). Select one (`POST /api/v2/session/select {"video": <camera id>}`, no

    `time`) and the session moves to it for everyone: `state.live.phase` is `connecting` until the first camera frame,

    `warming` while the interpreter runs on the first `warmup` seconds (3 s) with nothing released, then `live`: frames

    are released as they are interpreted, each with its camera picture (`GET /api/v2/session/frames/{g}/image.jpg`, the

    newest 64 kept). A camera cannot seek; pause freezes it for everyone, and play connects again and returns to the live

    edge after a new warm-up, as does a camera that sent nothing for 5 s. The unit interprets while someone watches (an

    open stream, the page, and for 15 s the client that sent a control). The 20.20 unit (build claude-20261123-speckle7) offers
    six

    cameras of three plants (at 1.6 to 3.9 frames a second on build claude-20261120-looks1; on build

    claude-20261122-hr4x1 at about 3.6 a second, as fast as its worker goes on a camera frame). Since build

    claude-20261120-looks1 the world also carries a `look` of each stone at rest (`StoneLook`), which the SDKs'' tray rules

    use; the recordings of 22 November (build claude-20261122-hr4x1) carry them, and those of 17 November, made before it,

    carry none. The API page

    https://factory.pdigger.com/developers/api/ has a demo server that answers from real 20.20 recordings, in your browser.


    **Three levels, one resource.** A frame `g` (5 per media second on a recording, one per interpreted picture on a

    camera) has five layers; ask for any subset.


    | Level | Use it for | Where |

    |---|---|---|

    | High: Interpreter | events, stones, hands, a stone''s path, the shared highlight | `world` layer, `/session/world*`,
    SDK `interpreter()` |

    | Mid: Streams and render-ready | live delivery; final 2-D/3-D draw lists | `/frames/stream`, `/frames`, `/render/*` |

    | Low: Frames and codec | the model''s own packet, maps, rasters, tensors | `raw`, `overlay`, `scene`, `cards` layers,
    `/raw/*`, `/frames/{g}` |


    **Async first.** Follow the session with `GET /api/v2/session/frames/stream` (server-sent events): each `frame`

    event''s id is `<boot>-<cursor>`; reconnect with `Last-Event-ID` and nothing is lost inside the retained window (512

    frames, about 100 s); `limit` and `max_s` end a stream and clients reconnect (the unit closes a finished stream about

    10 s later: count them yourself and close it, as the SDKs do); `gap` tells a slow consumer how many items it lost;

    `reset` means the server restarted. `clock` events carry the shared state (`media_time`, `rate`, `playing`, `session`),
    `worker`

    events the interpreter''s status. The worker reads up to 0.6 s of media ahead of the shared playhead, and frames arrive

    0.2 to 0.35 s of media ahead of it (on the 20.20 unit). A frame is released at most 300 ms after its packet; a layer not
    ready by then is listed in `missing` and is

    never pushed again (read it with `GET /frames/{g}`); the SDKs do that for you. While the session is paused, the

    paused frame''s world is refined and released again with a higher `world.rev`.


    **SDKs** (same features, same output): Go `pdigger-factory-sdk-go`, Python `pdigger-factory-sdk`, Rust

    `pdigger-factory-sdk`, TypeScript `pdigger-factory-sdk`. Each operation below names its method.


    **Coordinates.** Native px: pixels of the model crop, centres at integers (`px = u·W − 0.5`). Content units `u, v` in

    [0, 1]. Scene world: z up, board top at z = 0, template gauge (not metric). three.js: `(x, y, z) → (x, z, −y)`.


    **Errors.** `{"error": "<message>", "code": "<stable code>", "retry_ms"?, "field"?, "retained"?}`; key on `code`. Rate

    limits are checked before anything is applied, so a 429 is always safe to retry after `retry_ms`.


    **Access.** Today the API is LAN-only, without authentication or CORS, and controls must be same-origin. The SDKs can

    send a bearer token for deployments that require one.


    **Demo data.** The demo and the examples here come from public recordings: face keypoints, appearance masks and depth

    textures are removed from them, so those fields are absent there, also where a schema requires them (a face joint

    is null); the unit on the LAN sends them.

    '
  contact:
    name: eprojac
    url: https://factory.pdigger.com/
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  x-served-by:
    unit: 20.20 (Jetson Orin NX)
    build: claude-20261123-speckle7
    api: 2.2.0
servers:
- url: '{scheme}://{host}:{port}'
  description: Your unit on the factory LAN
  variables:
    scheme:
      default: http
      enum:
      - http
      - https
    host:
      default: factory-orin.local
    port:
      default: '8120'
tags:
- name: Interpreter
  x-level: high
  description: 'What happened, in the words of the interpreter: the persistent world of stones and hands, its event log (lift,
    carry, place, push, new, delete, split, ...), a stone''s path, and the stone highlighted for everyone. The SDKs turn these
    into typed events, activities (a move from lift to put-down, a burst of pushes) and plain sentences such as `21:17.8 Right
    hand lifts stone 2534`.'
- name: Sources
  x-level: high
  description: 'What the shared session can show: the recordings and the plant''s live cameras (`kind: camera`). A recording
    has a proxy video with byte ranges; a camera has none: each of its frames comes with the picture it was interpreted from
    (`GET /api/v2/session/frames/{g}/image.jpg`).'
- name: Session
  x-level: high
  description: The one shared session. Every viewer follows it; `select` and `seek` start a new interpretation run for everyone.
    Every control takes `dry_run=1` to validate without moving anything.
- name: Streams
  x-level: mid
  description: Async delivery. `frames/stream` pushes frames as server-sent events (or NDJSON) with resume by `Last-Event-ID`;
    `frames` is the long-poll for clients that cannot stream; `raw/stream` is the model codec. A stream counts as a viewer
    and keeps the interpreter running unless `observe=1`.
- name: Render-ready
  x-level: mid
  description: 'Final 2-D and 3-D draw lists at any retained time: no interpolation, no joints to resolve, styles resolved
    with `draw=primitives`.'
- name: Frames and codec
  x-level: low
  description: 'Random access to retained frames and their layers, the raw model packet (`sip1`), map rasters and debug tensors.
    Maps are base64 of u8 row-major (sip1: of zlib), bitsets LSB-first; the SDK codecs decode them.'
- name: Meta
  x-level: meta
  description: Entry point, this document, the running model and the skeleton topology.
- name: Ops
  x-level: ops
  description: Liveness, readiness, status and Prometheus metrics.
